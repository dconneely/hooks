# This repository's own hooks, run by prek. check-pii runs from the working
# tree as local hooks, so a change is checked by the version it makes.

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # Checks only: .gitattributes decides each file's line endings
      - id: mixed-line-ending
        args: [--fix=no]
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      # A missing executable bit only shows on macOS and Linux, and
      # `language: script` needs it
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck (POSIX sh)
        language: system
        entry: shellcheck -x -s sh --severity=warning
        files: ^(hooks|tests)/[^/]+\.sh$

      # Each hook's tests run when the hook or its tests change
      - id: check-pii-tests
        name: check-pii tests
        language: system
        entry: sh tests/check-pii.sh
        pass_filenames: false
        files: ^(hooks/check-pii\.sh|tests/(check-pii|common)\.sh)$

      - id: markdown-tests
        name: format-markdown and lint-markdown tests
        language: system
        entry: sh tests/markdown.sh
        pass_filenames: false
        files: ^(\.pre-commit-hooks\.yaml|\.pre-commit-config\.yaml|package\.json|(bin|lib|config)/.+|tests/(markdown|common)\.sh)$

      - id: sh-scripts-are-posix-tests
        name: sh-scripts-are-posix tests
        language: system
        entry: sh tests/sh-scripts-are-posix.sh
        pass_filenames: false
        files: ^(\.pre-commit-hooks\.yaml|\.pre-commit-config\.yaml|tests/(sh-scripts-are-posix|common)\.sh)$

      - id: actionlint
        name: actionlint (GitHub Actions workflows)
        description: checks the workflows, including ShellCheck on each
          `run:` step.
        language: system
        entry: actionlint
        files: ^\.github/workflows/[^/]+\.ya?ml$

      # The manifest's Markdown hooks, as local hooks running this checkout's
      # scripts: prek can't take this repository's own manifest. A local hook
      # can't install this repository as its dependency (npm runs in a
      # temporary directory; verified), so the tools are pinned again here.
      # Keep the versions in step with package.json; tests/markdown.sh checks
      # them.
      - id: format-markdown
        name: format-markdown (Prettier)
        language: node
        entry: node bin/format-markdown.js
        additional_dependencies: [prettier@3.9.6, markdownlint-cli2@0.23.2]
        types: [markdown]

      - id: lint-markdown
        name: lint-markdown (markdownlint-cli2)
        language: node
        entry: node bin/lint-markdown.js
        additional_dependencies: [prettier@3.9.6, markdownlint-cli2@0.23.2]
        types: [markdown]

      # The manifest's sh-scripts-are-posix, as a local hook for the same
      # reason; tests/sh-scripts-are-posix.sh checks the two match
      - id: sh-scripts-are-posix
        name: .sh scripts must not declare a Bash shebang (use .bash for Bash scripts)
        language: pygrep
        entry: '^#!.*\bbash\b'
        files: \.sh$

  - repo: local
    hooks:
      - id: gitleaks
        name: Gitleaks (secret scanning)
        language: system
        entry: gitleaks git --pre-commit --staged --redact -v
        pass_filenames: false

      - id: check-pii
        name: check-pii (personal details)
        language: system
        entry: sh hooks/check-pii.sh
        # LICENCE's copyright line names its holder, and the README's
        # example `repo:` line holds this repository's URL, whose owner's
        # handle shares a word with that name. The other modes reuse these.
        args: &pii-skips
          - --skip-line
          - 'LICENCE:^Copyright \(c\) [0-9]{4} [A-Z][a-z]+ [A-Z][a-z]+$'
          - --skip-line
          - 'README\.md:^[[:blank:]]*- repo: https://github\.com/[^[:blank:]@/]+/hooks$'
        pass_filenames: false

      - id: check-pii-msg
        name: check-pii (commit message)
        language: system
        entry: sh hooks/check-pii.sh --commit-msg
        stages: [commit-msg]

      # Run by hand, as the README says: after adding a pattern, and before
      # a release
      - id: check-pii-files
        name: check-pii (whole files)
        language: system
        entry: sh hooks/check-pii.sh --files
        args: *pii-skips
        types: [text]
        stages: [manual]

      - id: check-pii-history
        name: check-pii (history)
        language: system
        entry: sh hooks/check-pii.sh --history
        args: *pii-skips
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: conventional-commit
        name: Conventional Commits (commit message)
        description: >-
          the first line is `type: summary` or `type(scope): summary`, or
          Git's own Merge, Revert, fixup! or squash!.
        language: pygrep
        entry: '\A((build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: \S|Merge |Revert "|fixup! |squash! )'
        args: [--negate, --multiline]
        stages: [commit-msg]
