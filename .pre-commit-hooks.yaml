# The hooks this repository provides, read by prek and pre-commit. Each runs
# a POSIX sh script from this repository's checkout (`language: script`),
# with the consumer's root as the working directory.

- id: check-pii
  name: check-pii (personal details)
  description: fails if the staged diff adds personal details, derived from
    Git config and the OS at commit time, or listed in a machine-local file.
  language: script
  entry: hooks/check-pii.sh
  pass_filenames: false
  stages: [pre-commit]

- id: check-pii-msg
  name: check-pii (commit message)
  description: the same checks, on the commit message.
  language: script
  entry: hooks/check-pii.sh --commit-msg
  stages: [commit-msg]

- id: check-pii-files
  name: check-pii (whole files)
  description: the same checks, on the whole content and the paths of the
    files prek passes. Run by hand after adding a pattern.
  language: script
  entry: hooks/check-pii.sh --files
  types: [text]
  stages: [manual]

- id: check-pii-history
  name: check-pii (history)
  description: the same checks, on every added line, new path and commit
    message in the history of every branch. Run by hand before publishing.
  language: script
  entry: hooks/check-pii.sh --history
  pass_filenames: false
  always_run: true
  stages: [manual]
