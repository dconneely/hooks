# The hooks this repository provides, read by prek and pre-commit, which run
# them with the consumer's root as the working directory. check-pii runs a
# POSIX sh script from this repository's checkout (`language: script`).

- id: check-pii
  name: check-pii (personal details)
  description: fails if the staged diff adds personal details, derived from
    Git config and the OS at commit time, or listed in a machine-local file.
  language: script
  entry: hooks/check-pii.sh
  pass_filenames: false
  stages: [pre-commit]

- id: check-pii-msg
  name: check-pii (commit message)
  description: the same checks, on the commit message.
  language: script
  entry: hooks/check-pii.sh --commit-msg
  stages: [commit-msg]

- id: check-pii-files
  name: check-pii (whole files)
  description: the same checks, on the whole content and the paths of the
    files prek passes. Run by hand after adding a pattern.
  language: script
  entry: hooks/check-pii.sh --files
  types: [text]
  stages: [manual]

- id: check-pii-history
  name: check-pii (history)
  description: the same checks, on every added line, new path and commit
    message in the history of every branch. Run by hand before publishing.
  language: script
  entry: hooks/check-pii.sh --history
  pass_filenames: false
  always_run: true
  stages: [manual]

# Installs Prettier at the version this release pins, once per machine, with
# no per-commit download and no race between concurrent installs, unlike
# `npx` (verified with prek 0.5.10 on Windows: 40 s for the first run, then
# 1.6 s). pre-commit/mirrors-prettier stops at Prettier 3.1.0. The pin is an
# additional dependency, not one in package.json: npm links only the
# installed package's own bins, so on Linux `prettier` from package.json
# was not on the hook's PATH (verified with prek 0.5.10). Keep the version
# in step with .pre-commit-config.yaml's prettier hook; tests/prettier.sh
# checks it.
- id: prettier
  name: Prettier (formats Markdown)
  description: formats Markdown with the repository's own Prettier config.
    Override `types` or `types_or` for other file types.
  language: node
  entry: prettier --write --ignore-unknown
  additional_dependencies: [prettier@3.9.6]
  types: [markdown]

# ShellCheck checks a script in the dialect its shebang names, so a `.sh`
# file declaring Bash would pass Bash-only syntax that `sh` then fails on.
# .pre-commit-config.yaml runs a copy on this repository;
# tests/sh-scripts-are-posix.sh checks the two match.
- id: sh-scripts-are-posix
  name: .sh scripts must not declare a Bash shebang (use .bash for Bash scripts)
  language: pygrep
  entry: '^#!.*\bbash\b'
  files: \.sh$
